server {
    listen 80;
    server_name suuq.ugasfuad.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name suuq.ugasfuad.com;

    ssl_certificate /etc/letsencrypt/live/suuq.ugasfuad.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suuq.ugasfuad.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend static files
    root /var/www/suuq-admin;
    index index.html;

    # Security Headers
    set $csp_header "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; object-src 'none'; base-uri 'self';";
    add_header Content-Security-Policy $csp_header always;

    # Single Page App routing
    location = /index.html {
        # Always serve fresh index to avoid stale bundles after deploys
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Security-Policy $csp_header always;
        try_files $uri =404;
    }

    location /assets/ {
        # Cache static assets aggressively; they are content-hashed
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy
    # Adjust the upstream if your API lives elsewhere (http://127.0.0.1:3000, docker upstream, etc.)
    location /api/ {
        proxy_pass https://api.suuq.ugasfuad.com/;
        # Ensure upstream sees the correct host and TLS SNI
        proxy_set_header Host api.suuq.ugasfuad.com;
        proxy_ssl_server_name on;
        proxy_ssl_name api.suuq.ugasfuad.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
